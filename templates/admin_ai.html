<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estacle AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<style>
html, body { height: 100%; overflow: hidden; }
.app-layout { height: 100vh; overflow: hidden; }
.main-content {
  height: 100vh !important; max-height: 100vh !important;
  overflow: hidden !important; display: flex !important; flex-direction: column !important;
  background: transparent !important; padding-bottom: 0 !important;
}
.top-bar.dash-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px 8px !important;
  background: transparent !important; border: none !important; box-shadow: none !important;
  flex-shrink: 0; gap: 12px; flex-wrap: wrap;
}
.page-title { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 2px; letter-spacing: -0.02em; }
.page-subtitle { font-size: 12.5px; color: #64748b; margin: 0; }

.ai-frame {
  flex: 1 1 auto; min-height: 0; margin: 6px 28px 18px;
  background: #fff; border: 1px solid #e8ecf1; border-radius: 16px;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.03);
  display: flex; flex-direction: column; overflow: hidden;
  position: relative;
}
@media (max-width: 900px) {
  .ai-frame { margin: 6px 12px 14px; }
  .top-bar.dash-top { padding: 14px 14px 6px !important; }
}

.msgs {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px 20px 16px;
  display: flex; flex-direction: column; gap: 14px;
  background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
  position: relative;
  z-index: 1;
}

/* Centered low-opacity watermark when empty / always subtle */
.watermark {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 0;
}
.watermark span {
  font-size: clamp(18px, 3.2vw, 28px);
  font-weight: 600;
  color: #0f172a;
  opacity: 0.08;
  letter-spacing: -0.02em;
  text-align: center;
  padding: 0 24px;
  user-select: none;
}
.watermark.hidden { display: none; }

.row { display: flex; gap: 10px; align-items: flex-start; max-width: 820px; width: 100%; position: relative; z-index: 1; }
.row.user { align-self: flex-end; flex-direction: row-reverse; }
.row .avatar {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}
.row.assistant .avatar { background: #0f172a; color: #fff; }
.row.user .avatar { background: #e2e8f0; color: #475569; }
.row.system-row { align-self: center; max-width: 560px; }

.bubble {
  padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.55;
  word-break: break-word;
}
.row.assistant .bubble {
  background: #fff; border: 1px solid #e8ecf1; color: #0f172a;
  border-top-left-radius: 4px;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
}
.row.user .bubble {
  background: #0f172a; color: #f8fafc; border-top-right-radius: 4px;
}
.row.system-row .bubble {
  background: transparent; border: none; color: #94a3b8;
  font-size: 13px; text-align: center; border-radius: 12px;
  box-shadow: none; padding: 8px;
}

.md h2, .md h3 { margin: 10px 0 6px; font-size: 14px; font-weight: 700; color: #0f172a; }
.md h2:first-child, .md h3:first-child { margin-top: 0; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 6px 0 8px; padding-left: 18px; }
.md li { margin: 3px 0; }
.md strong { font-weight: 700; }
.md code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px; background: #f1f5f9; padding: 1px 6px; border-radius: 4px;
}
.md table {
  border-collapse: collapse; width: 100%; margin: 8px 0 4px; font-size: 12.5px;
  overflow: hidden; border-radius: 8px;
}
.md th, .md td { border: 1px solid #e2e8f0; padding: 7px 9px; text-align: left; }
.md th { background: #f8fafc; font-weight: 700; color: #334155; }
.md tr:nth-child(even) td { background: #fcfdfe; }

.confirm-card {
  max-width: 520px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 14px;
  padding: 14px 16px; box-shadow: 0 1px 2px rgba(15,23,42,0.04); position: relative; z-index: 1;
}
.confirm-card .tag {
  display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em;
  text-transform: uppercase; color: #b45309; background: #fef3c7; padding: 3px 8px;
  border-radius: 6px; margin-bottom: 8px;
}
.confirm-card h4 { margin: 0 0 6px; font-size: 14px; color: #0f172a; }
.confirm-card .args {
  font-size: 12.5px; color: #92400e; background: #fff7ed; border-radius: 8px;
  padding: 8px 10px; margin-bottom: 12px; font-family: ui-monospace, monospace;
  white-space: pre-wrap;
}
.confirm-actions { display: flex; gap: 8px; }
.btn-confirm {
  height: 36px; padding: 0 14px; border-radius: 9px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-confirm.yes { background: #b91c1c; color: #fff; }
.btn-confirm.no { background: #fff; color: #334155; border: 1px solid #e2e8f0; }

.suggest-bar {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; flex-shrink: 0;
  background: #fff; position: relative; z-index: 1;
}
.chip {
  font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px;
  border: 1px solid #e2e8f0; background: #fff; color: #334155; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.chip:hover { border-color: #a5b4fc; background: #f8fafc; }

.composer {
  border-top: 1px solid #f1f5f9; padding: 12px 14px 16px; display: flex; gap: 10px;
  flex-shrink: 0; background: #fff; align-items: flex-end; position: relative; z-index: 1;
}
.composer-inner {
  flex: 1; border: 1px solid #e2e8f0; border-radius: 14px; background: #f8fafc;
  padding: 4px 4px 4px 12px; display: flex; align-items: flex-end; gap: 6px;
  transition: border-color .15s, box-shadow .15s;
}
.composer-inner:focus-within {
  border-color: #a5b4fc; background: #fff;
  box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
}
.composer textarea {
  flex: 1; border: none; background: transparent; resize: none;
  min-height: 42px; max-height: 120px; padding: 10px 4px; font: inherit; font-size: 14px;
  color: #0f172a; outline: none;
}
.composer textarea::placeholder {
  color: #94a3b8;
  opacity: 1;
}
.composer .send {
  height: 40px; min-width: 40px; padding: 0 14px; border: none; border-radius: 11px;
  background: #0f172a; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
  font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.composer .send:disabled { opacity: 0.45; cursor: not-allowed; }
.composer .send svg { width: 16px; height: 16px; }
.typing-dots span {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: #94a3b8; margin: 0 2px; animation: blink 1.2s infinite ease-in-out;
}
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div class="app-layout">
{% set active = 'ai' %}
{% include 'partials/admin_sidebar.html' %}
<main class="main-content">
  <header class="top-bar dash-top">
    <div>
      <h1 class="page-title">Estacle AI</h1>
      <p class="page-subtitle">Your intelligent CRM assistant &amp; helpdesk</p>
    </div>
  </header>

  <div class="ai-frame">
    <div class="watermark" id="watermark"><span>Estacle AI is ready to serve you</span></div>
    <div class="msgs" id="msgs"></div>

    <div class="suggest-bar" id="suggestions">
      <button type="button" class="chip" data-q="Analyse my CRM and give a clear summary">Analyse my CRM</button>
      <button type="button" class="chip" data-q="Show available properties in a compact table">Available properties</button>
      <button type="button" class="chip" data-q="How do I add a property manually?">How to add a property</button>
      <button type="button" class="chip" data-q="List all clients and their status">Clients overview</button>
      <button type="button" class="chip" data-q="Show pending tasks">Pending tasks</button>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="Ask Estacle Ai" rows="1"></textarea>
        <button type="button" class="send" id="btnSend" title="Send">
          <span>Send</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</main>
</div>
<script>
(function(){
  var msgs = document.getElementById('msgs');
  var input = document.getElementById('input');
  var btnSend = document.getElementById('btnSend');
  var watermark = document.getElementById('watermark');
  var chatId = null;
  var history = [];
  var busy = false;
  var hasKey = {{ 'true' if settings.has_key else 'false' }};
  var hasConversation = false;

  function escapeHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderMarkdown(text) {
    var lines = String(text || '').replace(/\r\n/g,'\n').split('\n');
    var html = [];
    var inUl = false, inOl = false, inTable = false, tableRows = [];
    function closeLists() {
      if (inUl) { html.push('</ul>'); inUl = false; }
      if (inOl) { html.push('</ol>'); inOl = false; }
    }
    function flushTable() {
      if (!inTable || !tableRows.length) return;
      var out = ['<table>'];
      tableRows.forEach(function(row, idx){
        var cells = row.split('|').filter(function(c,i,a){ return !(i===0&&c.trim()==='') && !(i===a.length-1&&c.trim()===''); });
        if (cells.every(function(c){ return /^[\s:-]+$/.test(c); })) return;
        var tag = idx === 0 ? 'th' : 'td';
        out.push('<tr>' + cells.map(function(c){ return '<'+tag+'>'+inline(c.trim())+'</'+tag+'>'; }).join('') + '</tr>');
      });
      out.push('</table>');
      html.push(out.join(''));
      tableRows = []; inTable = false;
    }
    function inline(s) {
      s = escapeHtml(s);
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      return s;
    }
    lines.forEach(function(line){
      if (line.indexOf('|') !== -1 && line.trim().startsWith('|')) {
        closeLists(); inTable = true; tableRows.push(line); return;
      }
      if (inTable) flushTable();
      var hm = line.match(/^(#{1,3})\s+(.+)$/);
      if (hm) {
        closeLists();
        html.push('<h'+(hm[1].length+1)+'>'+inline(hm[2])+'</h'+(hm[1].length+1)+'>');
        return;
      }
      var ul = line.match(/^\s*[-*]\s+(.+)$/);
      if (ul) {
        if (inOl) { html.push('</ol>'); inOl = false; }
        if (!inUl) { html.push('<ul>'); inUl = true; }
        html.push('<li>'+inline(ul[1])+'</li>');
        return;
      }
      var ol = line.match(/^\s*\d+\.\s+(.+)$/);
      if (ol) {
        if (inUl) { html.push('</ul>'); inUl = false; }
        if (!inOl) { html.push('<ol>'); inOl = true; }
        html.push('<li>'+inline(ol[1])+'</li>');
        return;
      }
      closeLists();
      if (!line.trim()) return;
      html.push('<p>'+inline(line)+'</p>');
    });
    closeLists(); flushTable();
    return html.filter(Boolean).join('');
  }

  function markActive() {
    hasConversation = true;
    if (watermark) watermark.classList.add('hidden');
  }

  function addSystem(text) {
    markActive();
    var row = document.createElement('div');
    row.className = 'row system-row';
    row.innerHTML = '<div class="bubble">'+escapeHtml(text)+'</div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function addUser(text) {
    markActive();
    var row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = '<div class="avatar">You</div><div class="bubble">'+escapeHtml(text)+'</div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function addAssistant(text) {
    markActive();
    var row = document.createElement('div');
    row.className = 'row assistant';
    row.innerHTML = '<div class="avatar">AI</div><div class="bubble md">'+renderMarkdown(text)+'</div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function addTyping() {
    markActive();
    var row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    row.innerHTML = '<div class="avatar">AI</div><div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function removeTyping() {
    var t = document.getElementById('typingRow');
    if (t) t.remove();
  }
  function addConfirm(pending) {
    markActive();
    var wrap = document.createElement('div');
    wrap.className = 'confirm-card';
    wrap.innerHTML =
      '<div class="tag">Confirmation required</div>' +
      '<h4>Approve this CRM action?</h4>' +
      '<div class="args">'+escapeHtml(pending.tool)+'\n'+escapeHtml(JSON.stringify(pending.arguments, null, 2))+'</div>' +
      '<div class="confirm-actions">' +
        '<button type="button" class="btn-confirm yes">Confirm</button>' +
        '<button type="button" class="btn-confirm no">Cancel</button>' +
      '</div>';
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    wrap.querySelector('.yes').onclick = function(){ confirmPending(pending.pending_id, true, wrap); };
    wrap.querySelector('.no').onclick = function(){ confirmPending(pending.pending_id, false, wrap); };
  }

  function setBusy(v) {
    busy = v;
    btnSend.disabled = v;
  }

  function sendMessage(text) {
    text = (text || input.value || '').trim();
    if (!text || busy) return;
    if (!hasKey) {
      addSystem('Add your Groq API key under Settings → Estacle AI to start.');
      return;
    }
    input.value = '';
    addUser(text);
    history.push({ role: 'user', content: text });
    setBusy(true);
    addTyping();

    fetch('{{ url_for("admin.admin_ai_chat") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      body: JSON.stringify({ message: text, chat_id: chatId, history: history.slice(0, -1) })
    }).then(function(r){ return r.json().then(function(j){ return { body: j }; }); })
    .then(function(res){
      removeTyping();
      setBusy(false);
      var j = res.body;
      if (!j.ok) {
        addSystem(j.error || 'Request failed');
        return;
      }
      chatId = j.chat_id;
      addAssistant(j.reply || 'Done.');
      history.push({ role: 'assistant', content: j.reply || '' });
      if (j.pending) addConfirm(j.pending);
    }).catch(function(){
      removeTyping();
      setBusy(false);
      addSystem('Network error. Please try again.');
    });
  }

  function confirmPending(id, yes, card) {
    fetch('{{ url_for("admin.admin_ai_confirm") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pending_id: id, confirm: yes })
    }).then(function(r){ return r.json(); }).then(function(j){
      if (card) card.remove();
      if (j.cancelled) addSystem('Action cancelled.');
      else if (j.executed) {
        var msg = 'Action completed successfully.';
        if (j.result) {
          if (j.result.error) msg = 'Could not complete: ' + j.result.error;
          else {
            if (j.result.title) msg += ' · ' + j.result.title;
            if (j.result.property_id) msg += ' · property #' + j.result.property_id;
            if (j.result.client_id) msg += ' · client #' + j.result.client_id;
            if (j.result.user_id) msg += ' · user #' + j.result.user_id;
            if (j.result.deleted_property_id) msg += ' · deleted property #' + j.result.deleted_property_id;
            if (j.result.deleted_client_id) msg += ' · deleted client #' + j.result.deleted_client_id;
          }
        }
        addAssistant(msg);
      } else addSystem(j.error || 'Failed');
    });
  }

  btnSend.addEventListener('click', function(){ sendMessage(); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ sendMessage(c.getAttribute('data-q')); });
  });
})();
</script>
</body>
</html>
